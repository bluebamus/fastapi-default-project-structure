# 품질 게이트 — `docs/crp/groups/orm-raw-repository/charter.md` §3 (GATE 3) 자동화.
#
# 여기 있는 검사는 전부 charter 의 인수 기준을 1:1로 옮긴 것이다. 새 검사를 넣기 전에
# charter §3 을 먼저 고친다 — CI 가 계약보다 앞서 나가면 "왜 막혔는지" 근거가 사라진다.
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다
# (design-baseline C-5: 이 저장소는 FastAPI 코드/설정만 담는다).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 의존성 권고는 코드가 바뀌지 않아도 밖에서 늘어난다(ADR-035). push 가 없는 주에도
  # 게이트의 pip-audit 이 돌도록 주 1회 실행한다(ADR-044). 월요일 00:00 UTC = 09:00 KST.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GATE 3 (charter §3)
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 15
    # CI 에는 .env 가 없다. review_gate 의 공개 API 검사처럼 `main` 을 import 하는 단계는
    # ENV=test 여야 설정 검사(ADR-045: .env 부재·예시 비밀값)를 건너뛴다. pytest 는
    # pyproject 의 env 로 이미 ENV=test 다.
    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 전체 이력이 있어야 review_gate 의 "문서 인용 커밋 도달성" 이 실제로 돈다.
          # 기본값(fetch-depth 1, 얕은 클론)이면 그 검사는 판정할 수 없어 skip 한다(ADR-044).
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다(아래 주석 참조).
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다.
      # --locked: 락이 pyproject 와 어긋나면 설치하지 않고 실패한다(재현성).
      # --frozen 은 락을 검사하지 않고 그대로 써서, 락 갱신을 잊은 커밋이 초록으로 지나갔다.
      - name: 의존성 설치
        run: uv sync --locked

      # ── 정적 분석 ────────────────────────────────────────────────────────
      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # mypy 캐시는 의도적으로 복원하지 않는다.
      # 따뜻한 캐시의 결과를 게이트 결과로 기록해 3라운드 연속 오기한 적이 있다(ledger LEDGER-1).
      # CI 는 매번 콜드 캐시로 도는 것이 그 사고에 대한 구조적 방어다.
      - name: mypy (콜드 캐시)
        run: uv run mypy .

      # 실질 이슈만 막는다. LOW 는 테스트의 assert·문자열 상수 오탐이 대부분이라 게이트에서 뺀다
      # (과거 외부 감사에서 LOW 전수 검토 결과 실질 이슈 0건 — 보고서는 저장소에 없다).
      - name: bandit (MEDIUM 이상)
        run: uv run bandit -ll -q -r app main.py config.py

      # 계층 불변식(INV-1/2/5/10/11)·C-6·C-7·인용 정합·의존성 감사(pip-audit)는 이 스크립트에만
      # 있다. 전에는 CI 가 부르지 않아 로컬에서 돌린 사람만 확인했다(ADR-044).
      # --fast 는 게이트의 pytest 만 뺀다 — pytest 는 아래 단계가 skip 금지 조건으로 돌린다.
      - name: review_gate (구조 불변식 + 의존성 감사)
        run: uv run python -m scripts.review_gate --fast

      # ── 테스트 ──────────────────────────────────────────────────────────
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다.
      # charter §3 은 "조용한 SKIP·xfail 0" 을 인수 기준으로 둔다 — 통과 개수만 보고
      # 넘어가면 비활성화된 테스트가 초록불 뒤에 숨는다. 그래서 요약을 직접 판정한다.
      #
      # 외부 자원이 필요 없다 — DB 는 SQLite(aiosqlite), Redis 는 fakeredis 로 돈다.
      # 커버리지는 측정·출력만 한다. 하한은 pyproject.toml 의 fail_under 가 정한다.
      # term-missing:skip-covered 는 쓰지 않는다 — 그 "N files skipped" 줄이 아래 SKIP 판정에 걸린다.
      - name: pytest
        run: |
          set -o pipefail
          uv run python -m pytest -q -rsxX --cov=app --cov-branch --cov-report=term-missing | tee pytest.log

      - name: SKIP·xfail 0건 확인 (charter §3)
        run: |
          if grep -qE '[1-9][0-9]* (skipped|xfailed|xpassed)' pytest.log; then
            echo "::error::charter §3 위반 — 조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' pytest.log || true
            exit 1
          fi
          echo "SKIP·xfail 0건"

      # ── 구조 무결성 ──────────────────────────────────────────────────────
      # 마이그레이션 결과와 모델의 일치는 tests/core/test_migrations.py 가 검증한다.
      # 여기서는 head 가 갈라지지 않았는지만 본다 — 리비전 병합 실수는 테스트로 안 잡힌다.
      - name: alembic 단일 head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "head 개수: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::alembic head 가 ${heads} 개입니다. 단일 head 여야 합니다."
            uv run alembic heads
            exit 1
          fi
