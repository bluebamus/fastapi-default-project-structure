# 품질 게이트 — `docs/crp/groups/orm-raw-repository/charter.md` §3 (GATE 3) 자동화.
#
# 여기 있는 검사는 전부 charter 의 인수 기준을 1:1로 옮긴 것이다. 새 검사를 넣기 전에
# charter §3 을 먼저 고친다 — CI 가 계약보다 앞서 나가면 "왜 막혔는지" 근거가 사라진다.
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다
# (design-baseline C-5: 이 저장소는 FastAPI 코드/설정만 담는다).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GATE 3 (charter §3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다(아래 주석 참조).
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다.
      # --frozen: uv.lock 을 그대로 쓰고, 락이 pyproject 와 어긋나면 실패한다(재현성).
      - name: 의존성 설치
        run: uv sync --frozen

      # ── 정적 분석 ────────────────────────────────────────────────────────
      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # mypy 캐시는 의도적으로 복원하지 않는다.
      # 따뜻한 캐시의 결과를 게이트 결과로 기록해 3라운드 연속 오기한 적이 있다(ledger LEDGER-1).
      # CI 는 매번 콜드 캐시로 도는 것이 그 사고에 대한 구조적 방어다.
      - name: mypy (콜드 캐시)
        run: uv run mypy .

      # 실질 이슈만 막는다. LOW 는 테스트의 assert·문자열 상수 오탐이 대부분이라 게이트에서 뺀다
      # (과거 외부 감사에서 LOW 전수 검토 결과 실질 이슈 0건 — 보고서는 저장소에 없다).
      - name: bandit (MEDIUM 이상)
        run: uv run bandit -ll -q -r app main.py config.py

      # ── 테스트 ──────────────────────────────────────────────────────────
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다.
      # charter §3 은 "조용한 SKIP·xfail 0" 을 인수 기준으로 둔다 — 통과 개수만 보고
      # 넘어가면 비활성화된 테스트가 초록불 뒤에 숨는다. 그래서 요약을 직접 판정한다.
      #
      # Redis 는 startup 필수 자원이다. 실제 uvicorn 수명 테스트가 Redis 에 붙지 못하면
      # 모듈 전체가 skip 되고 아래 "SKIP 0" 판정에 걸린다. services: 대신 로컬과 같은
      # compose.test.yaml 로 띄운다 — 설정이 두 곳으로 갈리지 않게.
      - name: Redis 기동 (compose.test.yaml)
        run: docker compose -f compose.test.yaml up -d --wait redis-test

      # 이 job 에는 MySQL 이 없다. mysql 마커를 함께 돌리면 전부 skip 되고 "SKIP 0"
      # 판정에 걸린다. 그래서 여기서는 제외하고, 그 집합은 아래 mysql job 이
      # **실제 MySQL 에 대고** 실행한다 — 두 job 이 정확히 상보 관계다.
      - name: pytest (mysql 마커 제외)
        run: |
          set -o pipefail
          uv run python -m pytest -m "not mysql" -q -rsxX | tee pytest.log

      # deselected 는 위 -m 필터가 만드는 정상 결과라 판정에서 뺀다.
      - name: SKIP·xfail 0건 확인 (charter §3)
        run: |
          if grep -qE '[0-9]+ (skipped|xfailed|xpassed)' pytest.log; then
            echo "::error::charter §3 위반 — 조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' pytest.log || true
            exit 1
          fi
          echo "SKIP·xfail 0건"

      # ── 구조 무결성 ──────────────────────────────────────────────────────
      # 마이그레이션 체인은 tests/core/test_migration_chain.py 가 이미 검증한다(INV-5).
      # 여기서는 head 가 갈라지지 않았는지만 본다 — 리비전 병합 실수는 테스트로 안 잡힌다.
      - name: alembic 단일 head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "head 개수: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::alembic head 가 ${heads} 개입니다. 단일 head 여야 합니다."
            uv run alembic heads
            exit 1
          fi

      - name: Redis 정리
        if: always()
        run: docker compose -f compose.test.yaml down -v

  # ──────────────────────────────────────────────────────────────────────────
  # MySQL 8.4 통합 — gate job 이 제외한 mysql 마커 집합을 실제 MySQL 에 대고 실행한다.
  # 로컬과 **같은** compose.test.yaml 을 쓴다(services: 를 쓰지 않는 이유는 위와 같다).
  # --mysql-required 는 MySQL 에 닿지 못했을 때 skip 대신 실패하게 한다(conftest.py).
  # ──────────────────────────────────────────────────────────────────────────
  mysql:
    name: MySQL 8.4 통합 (compose.test.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --frozen

      # --wait 는 healthcheck 가 healthy 가 될 때까지 막는다. 컨테이너 "시작" 과
      # "접속 가능" 은 다르다 — 이 게이트 없이 붙으면 첫 테스트가 깨진다.
      - name: MySQL 기동
        run: docker compose -f compose.test.yaml up -d --wait mysql-test

      - name: pytest -m mysql (skip 금지)
        run: |
          set -o pipefail
          uv run python -m pytest -m mysql --mysql-required -q -rsxX | tee mysql.log
          if grep -qE '[0-9]+ skipped' mysql.log; then
            echo "::error::MySQL 통합 테스트가 skip 됐습니다. compose 기동을 확인하세요."
            exit 1
          fi
          if grep -q 'no tests ran' mysql.log; then
            echo "::error::mysql 마커가 붙은 테스트가 0건입니다."
            exit 1
          fi

      - name: MySQL 정리
        if: always()
        run: docker compose -f compose.test.yaml down -v
