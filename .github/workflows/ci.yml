# 품질 게이트 — 정적 분석, 구조 검사(scripts/review_gate.py), pytest.
#
# 배포·이미지 빌드는 다루지 않는다. 이 저장소는 FastAPI 코드와 설정만 담는다.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 의존성 권고는 코드가 바뀌지 않아도 밖에서 늘어난다. push 가 없는 주에도
  # 게이트의 pip-audit 이 돌도록 주 1회 실행한다. 월요일 00:00 UTC = 09:00 KST.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 15
    # CI 에는 .env 가 없다. review_gate 의 공개 API 검사처럼 `main` 을 import 하는 단계는
    # ENV=test 여야 설정 검사(.env 부재·예시 비밀값)를 건너뛴다. pytest 는
    # pyproject 의 env 로 이미 ENV=test 다.
    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version 을 uv 가 읽어 인터프리터를 맞춘다.
      # --locked: 락이 pyproject 와 어긋나면 설치하지 않고 실패한다(재현성).
      # --frozen 은 락을 검사하지 않고 그대로 써서, 락 갱신을 잊은 커밋이 초록으로 지나간다.
      - name: 의존성 설치
        run: uv sync --locked

      # ── 정적 분석 ────────────────────────────────────────────────────────
      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # mypy 캐시는 의도적으로 복원하지 않는다 — 따뜻한 캐시의 결과는 판정 근거가 못 된다.
      - name: mypy (콜드 캐시)
        run: uv run mypy .

      # 실질 이슈만 막는다. LOW 는 테스트의 assert·문자열 상수 오탐이 대부분이라 게이트에서 뺀다.
      - name: bandit (MEDIUM 이상)
        run: uv run bandit -ll -q -r app main.py config.py

      # 계층 불변식·공개 API 불변·의존성 감사(pip-audit) 등은 이 스크립트에만 있다.
      # --fast 는 게이트의 pytest 만 뺀다 — pytest 는 아래 단계가 skip 금지 조건으로 돌린다.
      - name: review_gate (구조 검사 + 의존성 감사)
        run: uv run python -m scripts.review_gate --fast

      # ── 테스트 ──────────────────────────────────────────────────────────
      # 외부 자원이 필요 없다 — DB 는 SQLite(aiosqlite), Redis 는 fakeredis 로 돈다.
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다. 통과 개수만 보면 비활성화된 테스트가
      # 초록불 뒤에 숨으므로 아래 단계가 요약을 직접 판정한다.
      # 커버리지는 측정·출력만 한다. 하한은 pyproject.toml 의 fail_under 가 정한다.
      # term-missing:skip-covered 는 쓰지 않는다 — 그 "N files skipped" 줄이 아래 SKIP 판정에 걸린다.
      - name: pytest
        run: |
          set -o pipefail
          uv run python -m pytest -q -rsxX --cov=app --cov-branch --cov-report=term-missing | tee pytest.log

      - name: SKIP·xfail 0건 확인
        run: |
          if grep -qE '[1-9][0-9]* (skipped|xfailed|xpassed)' pytest.log; then
            echo "::error::조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' pytest.log || true
            exit 1
          fi
          echo "SKIP·xfail 0건"

      # ── 구조 무결성 ──────────────────────────────────────────────────────
      # 마이그레이션 결과와 모델의 일치는 tests/core/test_migrations.py 가 검증한다.
      # 여기서는 head 가 갈라지지 않았는지만 본다 — 리비전 병합 실수는 테스트로 안 잡힌다.
      - name: alembic 단일 head
        run: |
          heads=$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "head 개수: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::alembic head 가 ${heads} 개입니다. 단일 head 여야 합니다."
            uv run alembic heads
            exit 1
          fi

  # ── MySQL 전용 동작 ────────────────────────────────────────────────────
  # SQLite 로는 드러나지 않는 것만 실제 MySQL 8.4 에서 본다(tests/mysql — 평소 pytest 는 수집하지 않는다):
  # baseline 마이그레이션·DATETIME(6) 왕복·드라이버 오류 코드 번역·읽기 전용 경로·CONVERT_TZ 집계·
  # caching_sha2_password 인증. compose 는 쓰지 않는다 — 서비스 컨테이너 하나로 끝난다.
  mysql:
    name: mysql
    runs-on: ubuntu-24.04  # gate 와 같은 이유로 고정
    timeout-minutes: 15
    services:
      mysql:
        # shortcut: 태그 고정 — digest 를 확인할 수 있으면 mysql:8.4@sha256:... 로 바꾼다.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password  # CI 일회용 컨테이너의 값이라 비밀이 아니다
        ports:
          - 3306:3306
        # 초기화 중의 임시 서버는 TCP 를 열지 않는다 — 127.0.0.1 로 물어야 본 서버가 뜬 뒤에 healthy 가 된다.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ENV: test
      # root: 테스트마다 DB 를 CREATE/DROP 하고, 인증 플러그인 확인에 mysql.user 를 읽는다.
      MYSQL_TEST_URL: mysql+aiomysql://root:ci-root-password@127.0.0.1:3306/mysql

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --locked

      # 경로를 직접 줘야 수집된다(pyproject norecursedirs). MYSQL_TEST_URL 이 없으면 skip 이 아니라 실패한다.
      - name: pytest (MySQL)
        run: |
          set -o pipefail
          uv run python -m pytest tests/mysql -q -rsxX | tee pytest-mysql.log

      - name: SKIP·xfail 0건 확인
        run: |
          if grep -qE '[1-9][0-9]* (skipped|xfailed|xpassed)' pytest-mysql.log; then
            echo "::error::조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' pytest-mysql.log || true
            exit 1
          fi
          echo "SKIP·xfail 0건"
